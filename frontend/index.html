<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhwani — AI Music Editor</title>
    <link rel="stylesheet" href="style.css?v=9">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">&#9835;</div>
                <h1>Dhwani</h1>
            </div>
            <span class="tagline">AI Music Editor</span>
        </header>

        <!-- Upload Screen -->
        <div id="upload-screen" class="screen active">
            <div class="upload-area" id="drop-zone">
                <div id="upload-idle">
                    <div class="upload-icon-wrap">
                        <span class="icon">&#127925;</span>
                    </div>
                    <h2>Drop your audio here</h2>
                    <p>MP3, WAV, OGG, FLAC, or M4A</p>
                    <input type="file" id="file-input" accept=".mp3,.wav,.ogg,.flac,.m4a" hidden>
                    <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                        Choose File
                    </button>
                </div>
                <div class="upload-progress" id="upload-progress">
                    <div class="up-filename" id="upload-filename"></div>
                    <div class="up-pct" id="upload-progress-text">0%</div>
                    <div class="up-track">
                        <div class="up-bar" id="upload-progress-bar"></div>
                    </div>
                    <div class="up-status" id="upload-status-label">Uploading&hellip;</div>
                    <div class="up-check" id="upload-check" aria-hidden="true">
                        <svg class="up-check-svg" viewBox="0 0 52 52">
                            <circle class="up-check-circle" cx="26" cy="26" r="23" fill="none"/>
                            <path class="up-check-mark" fill="none" d="M14.1 27.2l7.1 7.1 16.7-16.8"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Editor Screen -->
        <div id="editor-screen" class="screen">
            <div class="editor-layout">
                <!-- Audio Panel -->
                <div class="audio-panel">
                    <div class="file-info">
                        <span class="fi-icon">&#127925;</span>
                        <span class="fi-name" id="file-name">-</span>
                        <span class="fi-meta" id="file-meta"></span>
                    </div>

                    <div class="waveform-wrap" id="waveform-wrap">
                        <div id="waveform"></div>
                        <div class="waveform-overlay" id="waveform-loading">Loading waveform&hellip;</div>
                        <div class="wf-sparkles" id="wf-sparkles"></div>
                    </div>

                    <div class="player-bar">
                        <button class="p-btn" id="btn-back" onclick="seekBackward()" title="Back 5s">
                            &#9194;
                            <span class="shortcut">&larr;</span>
                        </button>
                        <button class="p-btn" id="btn-play" onclick="togglePlay()" title="Play / Pause">
                            &#9654;
                            <span class="shortcut">Space</span>
                        </button>
                        <button class="p-btn" id="btn-fwd" onclick="seekForward()" title="Forward 5s">
                            &#9193;
                            <span class="shortcut">&rarr;</span>
                        </button>
                        <div class="time">
                            <span class="curr" id="current-time">0:00</span> / <span id="total-time">0:00</span>
                        </div>
                        <div class="vol-wrap">
                            <span class="vol-icon" id="vol-toggle" onclick="toggleMute()">&#128266;</span>
                            <input type="range" id="volume-slider" min="0" max="100" value="80"
                                   oninput="setVolume(this.value)">
                        </div>
                    </div>

                    <div class="versions-panel">
                        <div class="versions-head" id="versions-head" onclick="toggleVersions()">
                            <h3>Version History</h3>
                            <span class="versions-active" id="versions-active">Original</span>
                            <span class="versions-chevron" id="versions-chevron">&#9660;</span>
                        </div>
                        <div class="versions-body" id="versions-body">
                            <div id="versions-list" class="versions-list">
                                <div class="v-item active">
                                    <span class="v-dot"></span>
                                    <span class="v-label">Original</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Panel -->
    <div class="chat-panel" id="chat-panel">
        <div class="chat-head">
            <div class="ch-icon" id="ch-avatar" title="Dhwani">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" class="avatar-svg">
                    <circle cx="32" cy="38" r="16" fill="#FFD9E8"/>
                    <path d="M16 30c-6 2-9 8-7 13" stroke="#8C5A2C" stroke-width="4" stroke-linecap="round" fill="none"/>
                    <path d="M48 30c6 2 9 8 7 13" stroke="#8C5A2C" stroke-width="4" stroke-linecap="round" fill="none"/>
                    <path d="M16 26q8-8 16-8t16 8l-2 3-14 4-14-4z" fill="#7C3AED"/>
                    <circle cx="26" cy="38" r="2.4" fill="#3B1D0F"/>
                    <circle cx="38" cy="38" r="2.4" fill="#3B1D0F"/>
                    <circle cx="26.9" cy="38.9" r="1" fill="#fff" opacity="0.9"/>
                    <circle cx="38.9" cy="38.9" r="1" fill="#fff" opacity="0.9"/>
                    <path d="M28 45q4 4 8 0" stroke="#E85D8A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
                    <circle cx="43" cy="33" r="3" fill="#FF6B9D" opacity="0.7"/>
                    <circle cx="45" cy="35" r="2" fill="#FF6B9D" opacity="0.5"/>
                </svg>
            </div>
            <h3>Dhwani</h3>
            <button class="ch-toggle" id="chat-toggle" onclick="toggleChatPanel()" title="Collapse / Expand">
                <span id="chat-chevron">&#9662;</span>
            </button>
            <button class="ch-close" id="chat-close" onclick="closeChat()" title="Close">
                &#10005;
            </button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="msg assistant">
                <div class="msg-bubble">
                    Hi! I'm Dhwani. Tell me how you'd like to change your track, like
                    <em>"make it louder"</em> or <em>"add reverb"</em>. 🎶
                </div>
            </div>
            <div class="chat-to-bottom" id="chat-to-bottom" onclick="scrollChatToBottom()">
                <span>&#9660;</span> New messages
            </div>
        </div>
        <div class="chat-input-area">
            <div class="quick-row">
                <button class="q-btn" onclick="sendQuick('Make it louder')">Louder</button>
                <button class="q-btn" onclick="sendQuick('Add reverb')">Reverb</button>
                <button class="q-btn" onclick="sendQuick('Add bass boost')">Bass</button>
                <button class="q-btn" onclick="sendQuick('Normalize')">Normalize</button>
                <button class="q-btn" onclick="sendQuick('Add compression')">Compress</button>
                <button class="q-btn" onclick="sendQuick('Trim the first 10 seconds')">Trim 10s</button>
            </div>
            <form onsubmit="sendMessage(event)">
                <input type="text" id="chat-input"
                       placeholder="Describe the edit..."
                       autocomplete="off">
                <button type="submit" class="btn btn-primary">Send</button>
            </form>
        </div>
    </div>

    <button class="chat-fab" id="chat-fab" onclick="toggleChat()">
        <span class="fab-icon fab-icon-chat">&#128172;</span>
        <span class="fab-icon fab-icon-close">&#10005;</span>
        <span class="fab-badge" id="fab-badge"></span>
    </button>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7.12.6/dist/wavesurfer.min.js"></script>
    <script src="app.js?v=10"></script>
</body>
</html>
